version: '3.8'

services:
  stickers-scraper:
    build: .
    container_name: stickers-scraper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Recife
    volumes:
      # Persistent data volumes
      - ./logs:/app/logs
      - ./data_captured:/app/data_captured
      - scraper_temp:/app/temp
      # Config file (read-only)
      - ./.env:/app/.env:ro
    networks:
      - scraper_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Optional: Add scraper for testing
  stickers-scraper-test:
    build: .
    container_name: stickers-scraper-test
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - TZ=America/Recife
    command: ["node", "index.js", "test"]
    volumes:
      - ./logs:/app/logs
      - ./data_captured:/app/data_captured
      - scraper_temp:/app/temp
      - ./.env:/app/.env:ro
    networks:
      - scraper_network
    profiles:
      - test
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Optional: Stats generator
  stickers-scraper-stats:
    build: .
    container_name: stickers-scraper-stats
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Recife
    command: ["node", "index.js", "stats"]
    volumes:
      - ./logs:/app/logs:ro
      - ./.env:/app/.env:ro
    networks:
      - scraper_network
    profiles:
      - stats
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  scraper_network:
    driver: bridge

volumes:
  scraper_temp:
    driver: local