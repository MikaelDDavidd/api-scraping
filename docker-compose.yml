services:
  # Serviço principal de scraping
  stickers-scraper:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: stickers-scraper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Recife
      - USE_LOCAL_STORAGE=true
      - LOCAL_STORAGE_PATH=/home/ubuntu/stickers
    volumes:
      # Logs e dados persistentes
      - ./logs:/app/logs
      - ./data_captured:/app/data_captured
      - ./.cache:/app/.cache
      # Storage de stickers (mapear para pasta da VPS)
      - /home/ubuntu/stickers:/home/ubuntu/stickers
      # Config (read-only)
      - ./.env:/app/.env:ro
      # Temp directory
      - scraper_temp:/app/temp
    networks:
      - scraper_network
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '1.5'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Comando padrão (pode ser sobrescrito)
    command: ["node", "index_enhanced.js"]

  # Serviço para testes (perfil separado)
  stickers-scraper-test:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: stickers-scraper-test
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - TZ=America/Recife
      - USE_LOCAL_STORAGE=true
      - LOCAL_STORAGE_PATH=./stickers
    command: ["node", "index_enhanced.js", "test"]
    volumes:
      - ./logs:/app/logs
      - ./data_captured:/app/data_captured
      - ./.cache:/app/.cache
      - ./stickers:/app/stickers
      - ./.env:/app/.env:ro
      - scraper_temp:/app/temp
    networks:
      - scraper_network
    profiles:
      - test
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Monitor de estatísticas (perfil separado)
  stickers-monitor:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: stickers-monitor
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Recife
    command: ["node", "monitor.js", "--watch"]
    volumes:
      - ./logs:/app/logs:ro
      - ./data_captured:/app/data_captured:ro
      - ./.cache:/app/.cache:ro
      - ./stickers:/app/stickers:ro
      - ./.env:/app/.env:ro
    networks:
      - scraper_network
    profiles:
      - monitor
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  scraper_network:
    driver: bridge

volumes:
  scraper_temp:
    driver: local