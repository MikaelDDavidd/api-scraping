services:
  # DISCOVERY SERVICE - Encontra packs novos
  discovery:
    image: node:18-slim
    container_name: stickers-discovery
    working_dir: /app
    command: >
      bash -c "
        apt-get update && 
        apt-get install -y libvips42 python3 make g++ curl && 
        npm ci && 
        node -e 'require(\"./run_parallel_system.js\").startDiscoveryWorker()'
      "
    environment:
      - NODE_ENV=production
      - SERVICE_TYPE=discovery
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - /home/ubuntu/api-scraping:/app
      - queue_data:/app/queue_data
      - logs_data:/app/logs
    restart: unless-stopped

  # LIGHT PROCESSOR - Processa packs simples/rápidos
  light-processor:
    image: node:18-slim
    container_name: stickers-light-processor
    working_dir: /app
    command: >
      bash -c "
        apt-get update && 
        apt-get install -y libvips42 python3 make g++ curl && 
        npm ci && 
        node -e 'require(\"./run_parallel_system.js\").startLightProcessor()'
      "
    environment:
      - NODE_ENV=production
      - SERVICE_TYPE=light_processor
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - /home/ubuntu/api-scraping:/app
      - queue_data:/app/queue_data
      - logs_data:/app/logs
      - stickers_data:/app/stickers
    depends_on:
      - discovery
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M

  # HEAVY PROCESSOR - Processa packs complexos
  heavy-processor:
    image: node:18-slim
    container_name: stickers-heavy-processor
    working_dir: /app
    command: >
      bash -c "
        apt-get update && 
        apt-get install -y libvips42 python3 make g++ curl && 
        npm ci && 
        node -e 'require(\"./run_parallel_system.js\").startHeavyProcessor()'
      "
    environment:
      - NODE_ENV=production
      - SERVICE_TYPE=heavy_processor
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    volumes:
      - /home/ubuntu/api-scraping:/app
      - queue_data:/app/queue_data
      - logs_data:/app/logs
      - stickers_data:/app/stickers
    depends_on:
      - discovery
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 400M

volumes:
  stickers_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/stickers

  queue_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/stickers-queue

  logs_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/stickers-logs

networks:
  default:
    name: stickers-network
