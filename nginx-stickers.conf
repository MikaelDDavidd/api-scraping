# Configuração nginx para servir stickers na VPS
server {
    listen 80;
    server_name stickers.yourdomain.com;  # Altere para seu domínio
    
    root /home/ubuntu/api-scraping/stickers;
    index index.html;
    
    # Cache para stickers (são estáticos)
    location ~* \.(webp|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
    }
    
    # Diretório browsing para debug (remover em produção)
    location / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        add_header Access-Control-Allow-Origin "*";
    }
    
    # Logs
    access_log /var/log/nginx/stickers-access.log;
    error_log /var/log/nginx/stickers-error.log;
}