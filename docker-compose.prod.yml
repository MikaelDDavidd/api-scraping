version: '3.8'

services:
  stickers-scraper:
    # Usar imagem do Docker Hub ao invés de build local
    image: ${DOCKER_IMAGE:-SEU_USUARIO/stickers-scraper:latest}
    container_name: stickers-scraper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Recife
    volumes:
      # Persistent data volumes
      - ./logs:/app/logs
      - ./data_captured:/app/data_captured
      - scraper_temp:/app/temp
    networks:
      - scraper_network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  scraper_network:
    driver: bridge

volumes:
  scraper_temp:
    driver: local